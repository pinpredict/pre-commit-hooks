- id: csharpier-worktree-guard
  name: csharpier (worktree-safe)
  description: |
    Wrap `dotnet csharpier format .` (or `check .` when CSHARPIER_MODE=check) so
    that the silent no-op observed in git worktrees fails the hook instead of
    falsely passing.
  entry: hooks/csharpier-worktree-guard.sh
  language: script
  files: '\.cs$'
  pass_filenames: false
  require_serial: true

- id: service-yaml-check
  name: .platform/services/*.yaml static checks
  description: |
    Static checks for new/changed .platform/services/<svc>.yaml files: verifies
    chart path resolves in service-template, image repo/PIA/push-role exist in
    TF, and networkPolicy ingress ports match the chart's declared health port.
    Catches the failure modes from platform-gitops#544 before merge.
  # Console script from pyproject.toml. A path entry (hooks/service-yaml-check.py)
  # cannot work here: `language: python` pip-installs this repo and runs `entry`
  # as a command, so the hook must resolve on the venv PATH.
  entry: service-yaml-check
  language: python
  files: '^\.platform/services/[^/]+\.yaml$'

- id: stevedore-release-scope
  name: stevedore release scope
  description: |
    Assert that onboarding or retiring a service does not silently widen the
    image build contract. Checks that each named service is an image id in
    .stevedore.yaml with a name-matching sibling chart, that docker-release and
    chart-release receive the same `only:` selector, and that
    change_detection.shared_paths carries the all-image contract signal without
    listing paths every onboarding touches (Dockerfile, .dockerignore, *.sln).
    Every assertion is opt-in via args, so repos missing a surface skip it.
  entry: stevedore-release-scope
  language: python
  files: '^(\.stevedore\.yaml|\.github/workflows/ci\.yml|charts/[^/]+/Chart\.yaml)$'
  pass_filenames: false

- id: no-production-newtonsoft
  name: reject production Newtonsoft references
  description: |
    Case-insensitive scan of every tracked .NET source and build file for a
    Newtonsoft reference, allowed only under the path prefixes named by
    --allow-prefix (the approved test and benchmark projects) and on the single
    central PackageVersion line named by --central-version-file. This is the
    static half of the policy; the transitive package-graph half needs `dotnet
    restore` and private feed credentials, so it stays in the consumer's CI.
    Enumerates files with `git ls-files`, not the staged set, so a violation in
    a file this commit did not touch still fails.
  entry: no-production-newtonsoft
  language: python
  pass_filenames: false
  always_run: true

- id: check-go-version-sync
  name: check go version sync (one root golang pin, every module respects it)
  description: |
    Enforces ONE Go toolchain pin per repo, in the root .tool-versions, that
    every module matches: a `golang` pin anywhere but the repo root is an
    error, a repo containing a go.mod must carry a root pin, and every
    go.mod's `go` directive must equal it. Previously it resolved each module
    against its NEAREST ANCESTOR pin and skipped modules that had none, so a
    pin one directory down left sibling modules unguarded while the hook
    reported success (2 of 3 modules in trader-tools), and per-module pins
    could drift independently. There is deliberately no opt-out. Replaces the
    per-repo scripts/check-go-version-sync.sh.
  entry: hooks/check-go-version-sync.sh
  language: script
  files: '(^|/)go\.mod$|(^|/)\.tool-versions$'
  pass_filenames: false

- id: k5s-stack-namespaces
  name: k5s stack overlays declare unique namespaces
  description: |
    Fails when two sibling k5s stack overlays declare the same `namespace:`. A
    new lane is usually a copy of an existing one, and a namespace left
    unchanged makes `k5s up` server-side-apply over the other lane's objects
    with no error — Ready pods running a blend of two lanes' configuration,
    which for a perf rig means every number it reports is measured against a
    universe nobody described. Asserts uniqueness only, never a naming
    convention; overlays that declare no namespace (inheriting the base stack's)
    are skipped. Compares every stack in the changed files' directories, not
    just the changed set, since a collision is a property of the whole set.
  entry: k5s-stack-namespaces
  language: python
  files: '(^|/)(k5s\.yaml|komp\.yaml|overlays/.*\.ya?ml)$'

- id: alert-annotation-shape
  name: alert annotation shape (title / Slack blockquote / folded description)
  description: |
    Guard the Slack-rendering traps in PrometheusRule annotations: a missing or
    interpolated `title` (Alertmanager silently falls back to the raw alertname
    once two alerts group), an over-long title (truncated in previews), a
    literal-block `description` (Slack keeps the newlines, so the card arrives
    as ragged half-lines), a paragraph starting with `>` (parsed as a
    blockquote — the char is eaten and the lines are joined), and an elapsed
    time rendered as raw seconds instead of `humanizeDuration`. All are invalid
    only in Slack: the YAML parses and the chart renders. Scans the whole
    `--root` (default `charts`) rather than the staged files, since an untouched
    rule is just as broken. Each check is disablable with `--skip <id>`.
  entry: alert-annotation-shape
  language: python
  files: '^charts/.*\.ya?ml$'
  pass_filenames: false

- id: k5s-fragment-parity
  name: k5s fragment agrees with its own repo
  description: |
    A repo publishing a `kind: Fragment` almost always runs that service itself
    too, so there are two definitions of one thing and nothing makes them agree.
    They drift immediately: magellan published a fragment pinning seven collector
    intervals to 60s while a separate PR removed exactly those overrides from the
    repo's own rig six minutes later — both green, and the fragment then told
    every consumer to do what the owner had just decided against.

    Compares each fragment service against the same service in the repo's own
    stack files: a key both set must agree, and a key only one sets is reported.
    Values the fragment PARAMETERIZES (${input:...}) are skipped — those are not
    claims about the value, so they cannot drift. Owner-vs-consumer differences
    (build/image/tag) and placement/sizing are ignored by default.
  entry: k5s-fragment-parity
  language: python
  pass_filenames: false
  # ALWAYS, not gated on `files:`. The invariant is a property of the REPO — does
  # the published fragment agree with how this repo runs the same service — not
  # of whichever file a commit happens to touch. Gated on `files:` the check is
  # skipped by every commit that does not edit the fragment or an overlay, which
  # includes pre-existing drift and, absurdly, the commit that ADOPTS the hook:
  # magellan#653 added it and went green with
  # `k5s fragment agrees with its own repo...Skipped`, over a repo that was
  # drifting the whole time.
  #
  # It is cheap to run unconditionally: a repo publishing no fragment returns
  # immediately without reading anything else.
  always_run: true
