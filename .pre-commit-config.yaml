# The hooks repo dogfoods its own gate. The unit tests run here too: a hook
# whose tests only run in CI is exactly how `service-yaml-check` stayed broken.
repos:
  - repo: local
    hooks:
      - id: hook-unit-tests
        name: hook unit tests
        entry: python3 -m unittest discover -s tests
        # `language: python` rather than `system`: the hooks import PyYAML via
        # _common, and a bare runner has no site-packages to find it in. Under
        # `system` this passed on every laptop and failed in CI with
        # `ModuleNotFoundError: No module named 'yaml'` — latent since the suite
        # was written, and first exercised when #9 became the first PR to change
        # these paths after the advisory job landed in #8.
        language: python
        additional_dependencies: ["PyYAML>=6"]
        pass_filenames: false
        files: ^(pinpredict_hooks/|tests/|pyproject\.toml$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yml']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
